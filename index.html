<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05050A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kevin & Iara" />
    <meta name="application-name" content="Kevin & Iara" />
    <title>Kevin & Iara</title>
    <!-- Controle de Indexação -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />

    <!-- Google Fonts - carregamento assíncrono otimizado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" /></noscript>
    <style>
      /* Mantém o motor do Eruda ativo em segundo plano para estabilidade no iOS WebKit, ocultando 100% da interface visual */
      .eruda-container, #eruda, [class*="eruda"] {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <!-- Runtime de estabilização do Safari iOS (Eruda headless, não-bloqueante) -->
    <!-- Os listeners de erro ficam síncronos (custo zero) para capturar erros imediatos -->
    <script>
      window.addEventListener('error', function() {});
      window.addEventListener('unhandledrejection', function() {});
    </script>
    <!-- Eruda carrega assincronamente: não bloqueia o parser HTML nem o JS principal -->
    <script async src="https://cdn.jsdelivr.net/npm/eruda" onload="eruda.init()"></script>
    <div id="root"></div>
    <!-- Portal isolado para modais: não sofre com overflow:hidden do body durante o lockBodyScroll no iOS -->
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
